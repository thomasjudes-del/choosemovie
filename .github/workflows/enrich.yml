name: Enrich movie catalogue

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich.mjs'
      - '.github/workflows/enrich.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enrich full catalogue
        run: node scripts/enrich.mjs
      - name: Commit enriched catalogue
        run: |
          git config user.name "ChooseMovie Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-01.js data-02.js data-03.js data-04.js unmatched.json
          if git diff --cached --quiet; then
            echo "No catalogue changes"
          else
            git commit -m "Enrich remaining catalogue"
            git push
          fi
