name: Enrich movie catalogue

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich_imdb.py'
      - '.github/workflows/enrich.yml'
      - 'data-01.js'
      - 'data-02.js'
      - 'data-03.js'
      - 'data-04.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Enrich from IMDb public pages
        env:
          WORKERS: '5'
        run: python scripts/enrich_imdb.py
      - name: Commit enriched catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-enriched.js
          if git diff --cached --quiet; then
            echo "No catalogue changes"
          else
            git commit -m "Enrich full movie catalogue"
            git push
          fi
