name: Enrich ChooseMovie catalog

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/enrich.mjs"
      - ".github/workflows/enrich.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Enrich catalog from Cinemeta
        run: node scripts/enrich.mjs
      - name: Commit enriched catalog
        run: |
          git config user.name "ChooseMovie Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-01.js data-02.js data-03.js data-04.js unmatched.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "Enrich full ChooseMovie catalog"
          git push
