<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChooseMovie</title>
  <link rel="stylesheet" href="styles.css?v=18">
</head>
<body>
  <header>
    <div class="head">
      <div class="brand">
        <div class="brand-mark">▶</div>
        <div>
          <h1>ChooseMovie</h1>
          <div class="sub">Ta bibliothèque, à scanner en un clin d'œil</div>
        </div>
      </div>
      <button class="primary" id="random">🎲 Random 5</button>
    </div>
  </header>

  <main>
    <div class="bar">
      <input class="search" id="q" placeholder="Titre, acteur, genre, mot-clé...">
      <div class="storage-switch" aria-label="Stockage">
        <button type="button" class="storage-btn active" data-storage="C">💻 C: PC</button>
        <button type="button" class="storage-btn" data-storage="E">💾 E: externe</button>
        <button type="button" class="storage-btn" data-storage="BOTH">C + E</button>
      </div>
      <div class="filters">
        <select id="type">
          <option value="all">Films + séries</option>
          <option value="movie">Films</option>
          <option value="tv">Séries</option>
          <option value="collection">Collections</option>
          <option value="unknown">À identifier</option>
        </select>
        <select id="genre"><option value="all">Tous genres</option></select>
        <select id="rating">
          <option value="0">Toute note</option>
          <option value="7">IMDb ≥ 7</option>
          <option value="7.5">IMDb ≥ 7.5</option>
          <option value="8">IMDb ≥ 8</option>
          <option value="8.5">IMDb ≥ 8.5</option>
        </select>
        <select id="dur">
          <option value="0">Toute durée</option>
          <option value="90">≤ 1h30</option>
          <option value="105">≤ 1h45</option>
          <option value="120">≤ 2h</option>
          <option value="150">≤ 2h30</option>
        </select>
        <select id="sort">
          <option value="title">A → Z</option>
          <option value="rating">Mieux notés</option>
          <option value="year">Plus récents</option>
          <option value="random">Mélanger</option>
        </select>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>Rien avec ces filtres.</div>
  </main>

  <script src="data-01.js?v=18"></script>
  <script src="data-02.js?v=18"></script>
  <script src="data-03.js?v=18"></script>
  <script src="data-04.js?v=18"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
