<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChooseMovie</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="head"><div><h1>ChooseMovie</h1><div class="sub">Ta bibliothèque, à scanner en un clin d'œil</div></div><button class="primary" id="random">🎲 Donne-moi 10</button></div></header><main><div class="tonight"><div><strong>Prêt à utiliser</strong><div class="note" style="margin:3px 0 0">Ta bibliothèque est déjà chargée. Aucun import, aucun token.</div></div><button class="primary" id="onlyReady">Voir les enrichis</button></div><div class="bar"><input class="search" id="q" placeholder="Titre, acteur, genre, mot-clé..."><div class="filters"><select id="type"><option value="all">Films + séries</option><option value="movie">Films</option><option value="tv">Séries</option><option value="collection">Collections</option></select><select id="genre"><option value="all">Tous genres</option></select><select id="rating"><option value="0">Toute note</option><option value="7">IMDb ≥ 7</option><option value="7.5">IMDb ≥ 7.5</option><option value="8">IMDb ≥ 8</option><option value="8.5">IMDb ≥ 8.5</option></select><select id="dur"><option value="0">Toute durée</option><option value="90">≤ 1h30</option><option value="105">≤ 1h45</option><option value="120">≤ 2h</option><option value="150">≤ 2h30</option></select><select id="sort"><option value="title">A → Z</option><option value="rating">Mieux notés</option><option value="year">Plus récents</option><option value="random">Mélanger</option></select></div></div><div class="stats" id="stats"></div><div class="note">★ = note IMDb pour les fiches déjà enrichies. Les autres restent sans note plutôt que d'en inventer une.</div><div class="list" id="list"></div><div class="empty" id="empty" hidden>Rien avec ces filtres.</div></main><script src="data-01.js"></script><script src="data-02.js"></script><script src="data-03.js"></script><script src="data-04.js"></script><script src="app.js"></script></body></html>
